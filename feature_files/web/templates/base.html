<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Multi-Broker Arbitrage{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        :root {
            --bs-body-bg: #1a1a2e;
            --bs-body-color: #e0e0e0;
            --card-bg: #16213e;
            --card-border: #0f3460;
            --accent-color: #e94560;
            --success-color: #00d09c;
            --warning-color: #ffc107;
        }

        body {
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .navbar {
            background-color: var(--card-bg) !important;
            border-bottom: 1px solid var(--card-border);
        }

        .navbar-brand {
            font-weight: 600;
            color: var(--accent-color) !important;
        }

        .nav-link {
            color: var(--bs-body-color) !important;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--accent-color) !important;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
        }

        .card-header {
            background-color: transparent;
            border-bottom: 1px solid var(--card-border);
            font-weight: 600;
        }

        .stat-card {
            text-align: center;
            padding: 1.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.875rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .positive { color: var(--success-color); }
        .negative { color: var(--accent-color); }
        .neutral { color: var(--warning-color); }

        .btn-primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .btn-primary:hover {
            background-color: #c73e54;
            border-color: #c73e54;
        }

        .btn-success {
            background-color: var(--success-color);
            border-color: var(--success-color);
        }

        .form-control, .form-select {
            background-color: #0f3460;
            border-color: var(--card-border);
            color: var(--bs-body-color);
        }

        .form-control:focus, .form-select:focus {
            background-color: #0f3460;
            border-color: var(--accent-color);
            color: var(--bs-body-color);
            box-shadow: 0 0 0 0.25rem rgba(233, 69, 96, 0.25);
        }

        .table {
            color: var(--bs-body-color);
        }

        .table-dark {
            --bs-table-bg: var(--card-bg);
            --bs-table-border-color: var(--card-border);
        }

        .badge-connected { background-color: var(--success-color); }
        .badge-disconnected { background-color: #6c757d; }
        .badge-error { background-color: var(--accent-color); }

        .zscore-display {
            font-size: 3rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }

        .price-display {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
        }

        .algo-toggle {
            font-size: 1.5rem;
        }

        #status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .status-running { background-color: var(--success-color); animation: pulse 2s infinite; }
        .status-stopped { background-color: #6c757d; }
        .status-error { background-color: var(--accent-color); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chart-container {
            height: 300px;
            background-color: #0f3460;
            border-radius: 8px;
        }

        /* Market Sessions Panel */
        .market-sessions-panel {
            background: linear-gradient(135deg, #1565c0 0%, #1976d2 100%);
            border-radius: 8px;
            padding: 12px 16px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .sessions-label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .sessions-list {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .session {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .session-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }

        .session.active .session-dot {
            background: #4caf50;
            box-shadow: 0 0 6px #4caf50;
        }

        .session-time {
            color: rgba(255,255,255,0.7);
            font-size: 0.75rem;
        }

        .next-session {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.85);
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-graph-up-arrow me-2"></i>Multi-Broker Arb
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="/dashboard">
                            <i class="bi bi-speedometer2 me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'settings' %}active{% endif %}" href="/settings">
                            <i class="bi bi-gear me-1"></i>Settings
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'setup' %}active{% endif %}" href="/setup">
                            <i class="bi bi-hdd-network me-1"></i>Setup
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'analysis' %}active{% endif %}" href="/analysis">
                            <i class="bi bi-bar-chart me-1"></i>SD Analysis
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span id="status-indicator" class="status-stopped"></span>
                    <span id="status-text" class="me-3">Stopped</span>
                    <button id="engine-toggle" class="btn btn-outline-success btn-sm">
                        <i class="bi bi-play-fill"></i> Start
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <script>
        // Socket.IO connection
        const socket = io();

        socket.on('connect', () => {
            console.log('Connected to server');
            socket.emit('request_status');
        });

        socket.on('status', (data) => {
            updateStatus(data.state);
        });

        socket.on('tick', (data) => {
            updateTickData(data);
        });

        socket.on('signal', (data) => {
            updateSignal(data);
        });

        socket.on('trade', (data) => {
            handleTrade(data);
        });

        // Status indicator
        function updateStatus(state) {
            const indicator = document.getElementById('status-indicator');
            const text = document.getElementById('status-text');
            const btn = document.getElementById('engine-toggle');

            indicator.className = '';
            if (state === 'RUNNING') {
                indicator.classList.add('status-running');
                text.textContent = 'Running';
                btn.innerHTML = '<i class="bi bi-stop-fill"></i> Stop';
                btn.classList.remove('btn-outline-success');
                btn.classList.add('btn-outline-danger');
            } else if (state === 'ERROR') {
                indicator.classList.add('status-error');
                text.textContent = 'Error';
            } else {
                indicator.classList.add('status-stopped');
                text.textContent = 'Stopped';
                btn.innerHTML = '<i class="bi bi-play-fill"></i> Start';
                btn.classList.remove('btn-outline-danger');
                btn.classList.add('btn-outline-success');
            }
        }

        // Engine toggle
        document.getElementById('engine-toggle').addEventListener('click', async () => {
            const btn = document.getElementById('engine-toggle');
            const isRunning = btn.classList.contains('btn-outline-danger');

            const endpoint = isRunning ? '/api/engine/stop' : '/api/engine/start';
            const response = await fetch(endpoint, { method: 'POST' });
            const result = await response.json();

            if (!result.success) {
                alert('Error: ' + result.error);
            }
        });

        // Override these in specific pages
        function updateTickData(data) {}
        function updateSignal(data) {}
        function handleTrade(data) {}
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
