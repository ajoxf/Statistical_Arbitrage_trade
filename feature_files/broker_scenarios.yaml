# =============================================================================
# StatArb Pro - Flexible Broker Configuration Examples
# =============================================================================
#
# This file shows ALL possible broker combinations for basis trading.
# Uncomment the scenario you want to use.
#
# Supported Combinations:
#   1. Same broker (MT5) for Spot and Futures - UNIFIED mode
#   2. Same broker (FIX) for Spot and Futures - UNIFIED mode
#   3. Different MT5 brokers for Spot and Futures
#   4. Different FIX brokers for Spot and Futures
#   5. MT5 for Spot + FIX for Futures (or vice versa)
#   6. IBKR for Spot + FIX for Futures (or vice versa)
#   7. OKX for both Spot and Futures (same account)
#
# =============================================================================


# =============================================================================
# SCENARIO 1: Same MT5 Broker - UNIFIED Mode
# =============================================================================
# Use when your MT5 broker offers BOTH spot and futures on same account
# Example: Broker offers XAUUSD (spot) and GOLD.f (futures)

# scenario_1_mt5_unified:
#   mode: unified
#   brokers:
#     - broker_id: mt5_unified
#       name: "MT5 Unified (Spot + Futures)"
#       type: MT5
#       role: UNIFIED
#       unified_mode: true
#
#       # MT5 Connection
#       mt5_path: "C:\\Program Files\\MetaTrader 5\\terminal64.exe"
#       mt5_account: 12345678
#       mt5_server: "YourBroker-Live"
#       mt5_password: "your_password"
#
#       # Both symbols on same account
#       spot_symbol: XAUUSD
#       futures_symbol: GOLD.f    # Or GC-Z24, depending on broker


