# =============================================================================
# SCENARIO 7: OKX for Both Spot and Futures (Recommended for Crypto)
# =============================================================================
# OKX Unified Account - same credentials, different symbols

scenario_7_okx:
  mode: separate  # Still uses two adapters, but same credentials
  brokers:
    # OKX Spot
    - broker_id: okx_spot
      name: "OKX Spot"
      type: OKX
      role: SPOT
      # Credentials from .env file (OKX_API_KEY, OKX_API_SECRET, OKX_PASSPHRASE)
      okx_simulated: true
      okx_account_type: spot
      symbol: BTC-USDT

    # OKX Perpetual Swap (Futures)
    - broker_id: okx_futures
      name: "OKX Perpetual Swap"
      type: OKX
      role: FUTURES
      # Same credentials from .env
      okx_simulated: true
      okx_account_type: swap
      symbol: BTC-USDT-SWAP


# =============================================================================
# TRADING PARAMETERS (Common to all scenarios)
# =============================================================================

trading:
  # Signal generation
  z_score_entry: 2.0
  z_score_exit: 0.5
  lookback_period: 100

  # Position sizing
  max_position_size: 1.0
  min_position_size: 0.01

  # Risk management
  max_spread_pct: 0.1
  max_positions: 5

  # Execution
  order_type: PEGGED_LIMIT  # MARKET, LIMIT, or PEGGED_LIMIT
  peg_offset_ticks: 1

database:
  path: trading.db

logging:
  level: INFO
  file: logs/statarb.log
