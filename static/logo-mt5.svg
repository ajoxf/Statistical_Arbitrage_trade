<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 50" width="62" height="50"
     role="img" aria-label="MetaTrader 5">
  <title>MetaTrader 5</title>
  <!-- A plain wordmark, deliberately: same family, weight, size and
       gradient as the NEXUS text beside it, so the two read as one
       header. Not the MetaQuotes trademark — it names the platform
       orders route through without borrowing the vendor's branding. -->
  <defs>
    <linearGradient id="mt5Word" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
  </defs>
  <text x="0" y="33" font-family="'Segoe UI', Arial, sans-serif"
        font-size="24" font-weight="700" letter-spacing="3"
        fill="url(#mt5Word)">MT5</text>
</svg>
